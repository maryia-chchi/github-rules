name: Transition Jira Ticket to In Dev

on:
  push:
    branches-ignore:
      - main

jobs:
  transition-to-in-dev:
    name: Jira — transition to In Dev
    runs-on: ubuntu-latest
    if: github.event.before == '0000000000000000000000000000000000000000'

    steps:
      - name: Extract Jira ticket ID from branch name
        id: extract
        run: |
          BRANCH="${{ github.ref_name }}"
          TICKET=$(echo "$BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1)

          if [ -z "$TICKET" ]; then
            echo "No Jira ticket ID found in branch name '$BRANCH'. Skipping."
            exit 0
          fi

          echo "ticket=$TICKET" >> $GITHUB_OUTPUT
          echo "Found ticket: $TICKET"

      - name: Check current status
        id: status
        if: steps.extract.outputs.ticket != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          TICKET="${{ steps.extract.outputs.ticket }}"

          RESPONSE=$(curl -s \
            --write-out "\n%{http_code}" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET?fields=status,summary")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Jira ticket $TICKET not found. Skipping."
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jira API returned HTTP $HTTP_CODE. Check JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN secrets."
            exit 1
          fi

          STATUS=$(echo "$BODY" | jq -r '.fields.status.name')
          SUMMARY=$(echo "$BODY" | jq -r '.fields.summary')

          echo "Ticket:  $TICKET"
          echo "Summary: $SUMMARY"
          echo "Status:  $STATUS"

          if [ "$STATUS" != "Ready For Dev" ]; then
            echo "Ticket is already in '$STATUS'. Skipping transition."
            exit 0
          fi

          echo "should_transition=true" >> $GITHUB_OUTPUT

      - name: Transition to In Dev
        if: steps.status.outputs.should_transition == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          TICKET="${{ steps.extract.outputs.ticket }}"

          TRANSITIONS=$(curl -s \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions")

          TRANSITION_ID=$(echo "$TRANSITIONS" | jq -r '.transitions[] | select(.to.name == "In Dev") | .id' | head -1)

          if [ -z "$TRANSITION_ID" ]; then
            echo "::error::No transition to 'In Dev' found for $TICKET. Check that 'Ready for Dev' → 'In Dev' is a valid transition in your Jira workflow."
            exit 1
          fi

          RESPONSE=$(curl -s \
            --write-out "\n%{http_code}" \
            --request POST \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)

          if [ "$HTTP_CODE" = "204" ]; then
            echo "OK: $TICKET transitioned to 'In Dev'."
          else
            echo "::error::Failed to transition $TICKET. HTTP status: $HTTP_CODE"
            exit 1
          fi
